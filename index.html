<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>鄭雨絲 · 淡粉色星空MR展廳 · 臥遊</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', '華文細黑', 'PingFang TC', 'Microsoft YaHei', sans-serif;
      background: #fdf0f5;
      touch-action: none;
    }
    #info {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: #8a5a75;
      font-size: 14px;
      letter-spacing: 2px;
      background: rgba(255, 240, 248, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 20px;
      width: fit-content;
      margin: 0 auto;
      border-radius: 60px;
      border: 1px solid rgba(240, 180, 210, 0.4);
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 1px 6px rgba(255, 220, 235, 0.5);
      box-shadow: 0 4px 20px rgba(220, 150, 180, 0.15);
    }
    #info span { opacity: 0.7; font-weight: 300; }
    @media (max-width: 600px) { 
      #info { font-size: 11px; padding: 4px 14px; bottom: 12px; letter-spacing: 1px; }
    }

    #loading {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #fdf0f5;
      display: flex; align-items: center; justify-content: center;
      color: #d890b5; font-size: 20px; letter-spacing: 6px;
      z-index: 999; transition: opacity 0.8s ease;
      pointer-events: none; font-weight: 300;
      text-shadow: 0 2px 12px rgba(230, 160, 195, 0.3);
    }
    #loading.hide { opacity: 0; }

    /* MR 掃描提示條 */
    #mr-banner {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, 
        rgba(255, 200, 225, 0.85), 
        rgba(255, 215, 235, 0.85), 
        rgba(200, 225, 255, 0.85), 
        rgba(245, 195, 230, 0.85), 
        rgba(255, 210, 232, 0.85),
        rgba(255, 200, 225, 0.85));
      background-size: 300% 100%;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 6px 22px;
      border-radius: 40px;
      color: #9a5a80;
      font-size: 13px;
      letter-spacing: 3px;
      border: 1px solid rgba(245, 190, 220, 0.5);
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(220, 150, 190, 0.25);
      text-shadow: 0 1px 4px rgba(255, 230, 245, 0.7);
      animation: mrPulse 3s ease-in-out infinite, mrRainbow 8s linear infinite;
      white-space: nowrap;
    }
    @keyframes mrPulse {
      0%, 100% { opacity: 0.85; box-shadow: 0 4px 20px rgba(220, 150, 190, 0.25); }
      50% { opacity: 1; box-shadow: 0 4px 35px rgba(200, 180, 255, 0.5); }
    }
    @keyframes mrRainbow {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }
    @media (max-width: 600px) { 
      #mr-banner { font-size: 10px; padding: 4px 14px; letter-spacing: 2px; top: 14px; }
    }

    /* MR 掃描線 */
    #mr-scanner {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
      opacity: 0.5;
    }
    #mr-scanner::before {
      content: '';
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(255, 210, 235, 0.1) 45%, 
        rgba(255, 180, 220, 0.25) 50%, 
        rgba(255, 210, 235, 0.1) 55%, 
        transparent 100%);
      animation: mrScan 6s ease-in-out infinite;
    }
    @keyframes mrScan {
      0% { top: -100%; }
      100% { top: 100%; }
    }

    #mr-ambient {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 4;
      background: 
        radial-gradient(ellipse at 20% 30%, rgba(255, 200, 230, 0.08), transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(200, 220, 255, 0.06), transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(240, 200, 240, 0.05), transparent 70%);
      animation: mrAmbient 8s ease-in-out infinite alternate;
    }
    @keyframes mrAmbient {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .mr-corner {
      position: fixed;
      width: 40px; height: 40px;
      border: 2px solid rgba(240, 160, 200, 0.4);
      pointer-events: none;
      z-index: 6;
      animation: mrCornerPulse 2s ease-in-out infinite;
    }
    .mr-corner.tl { top: 20px; left: 20px; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
    .mr-corner.tr { top: 20px; right: 20px; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
    .mr-corner.bl { bottom: 20px; left: 20px; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
    .mr-corner.br { bottom: 20px; right: 20px; border-left: none; border-top: none; border-radius: 0 0 8px 0; }
    @keyframes mrCornerPulse {
      0%, 100% { border-color: rgba(240, 160, 200, 0.4); }
      50% { border-color: rgba(220, 180, 255, 0.7); }
    }
    @media (max-width: 600px) {
      .mr-corner { width: 28px; height: 28px; }
      .mr-corner.tl { top: 12px; left: 12px; }
      .mr-corner.tr { top: 12px; right: 12px; }
      .mr-corner.bl { bottom: 12px; left: 12px; }
      .mr-corner.br { bottom: 12px; right: 12px; }
    }

    /* 詳情彈窗 */
    #detail-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(60, 35, 50, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      animation: fadeIn 0.4s ease;
      padding: 12px;
    }
    #detail-overlay.active { display: flex; }
    #detail-box {
      background: rgba(255, 248, 252, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 28px;
      max-width: 1100px;
      width: 100%;
      max-height: 94vh;
      overflow-y: auto;
      padding: 20px 22px 22px 22px;
      box-shadow: 0 30px 80px rgba(120, 60, 90, 0.4), 0 0 0 1px rgba(245, 190, 220, 0.3);
      position: relative;
      border: 1px solid rgba(245, 200, 225, 0.5);
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
    }
    #detail-close {
      position: sticky;
      top: 0;
      align-self: flex-end;
      background: rgba(220, 150, 190, 0.15);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      color: #8a5a75;
      font-size: 28px;
      width: 44px; height: 44px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(230, 170, 205, 0.3);
      flex-shrink: 0;
      margin-bottom: 2px;
      z-index: 5;
      touch-action: manipulation;
    }
    #detail-close:hover, #detail-close:active { background: rgba(230, 170, 205, 0.3); transform: scale(1.05); }

    #detail-content {
      display: flex;
      flex-direction: row;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    #detail-image-area {
      flex: 1 1 380px;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }
    #detail-main-img {
      width: 100%;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(120, 60, 90, 0.2);
      background: #2a1825;
      object-fit: contain;
      max-height: 420px;
      min-height: 200px;
      border: 1px solid rgba(240, 190, 215, 0.3);
      cursor: zoom-in;
      transition: transform 0.2s, filter 0.3s ease, opacity 0.3s ease;
      touch-action: manipulation;
      aspect-ratio: 1 / 1;
    }
    #detail-main-img:active { transform: scale(0.98); }

    /* 沉浸式 MR 動畫畫布 (悠然自得第二模式) */
    #immersive-video-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      display: none;
      z-index: 2;
      background: #e8e0d0;
      box-shadow: 0 10px 30px rgba(120, 60, 90, 0.2);
      border: 1px solid rgba(240, 190, 215, 0.3);
    }
    #immersive-video-canvas.active { display: block; }

    /* MR 掃描濾鏡層 */
    #mr-anim-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      pointer-events: none;
      display: none;
      z-index: 3;
      box-shadow: inset 0 0 80px rgba(255,200,230,0.2);
    }
    #mr-anim-overlay.active { display: block; }
    #mr-anim-overlay::before {
      content: '';
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(255, 210, 235, 0.2) 45%, 
        rgba(255, 180, 220, 0.4) 50%, 
        rgba(255, 210, 235, 0.2) 55%, 
        transparent 100%);
      animation: mrScan 3s ease-in-out infinite;
    }

    /* 進度條 */
    #anim-progress {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 4px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 4px;
      overflow: hidden;
      display: none;
      z-index: 4;
    }
    #anim-progress.active { display: block; }
    #anim-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #e8a8c8, #d888b0);
      border-radius: 4px;
    }

    /* 模式提示徽章 */
    #mode-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 5px 14px;
      border-radius: 30px;
      background: rgba(255, 245, 250, 0.9);
      backdrop-filter: blur(6px);
      color: #8a5a75;
      font-size: 12px;
      letter-spacing: 1px;
      border: 1px solid rgba(240, 190, 220, 0.6);
      box-shadow: 0 4px 12px rgba(200, 140, 180, 0.15);
      z-index: 5;
      display: none;
      font-weight: 500;
      pointer-events: none;
    }
    #mode-badge.active { display: block; }

    .mr-glow-effect {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 18px;
      pointer-events: none;
      background: 
        radial-gradient(circle at 30% 20%, rgba(255, 200, 225, 0.15), transparent 60%),
        radial-gradient(circle at 70% 80%, rgba(200, 220, 255, 0.12), transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(240, 200, 235, 0.1), transparent 70%);
      animation: mrGlow 4s ease-in-out infinite alternate;
      z-index: 3;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .mr-glow-effect.active { opacity: 1; }
    @keyframes mrGlow {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    #detail-thumbs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .thumb-wrapper {
      position: relative;
      display: inline-block;
    }
    .thumb-img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      background: #f5d8e8;
      box-shadow: 0 2px 8px rgba(180, 100, 140, 0.1);
      touch-action: manipulation;
      display: block;
    }
    .thumb-img:hover, .thumb-img:active { border-color: #e0a0c5; transform: scale(1.04); }
    .thumb-img.active { border-color: #d080b0; box-shadow: 0 0 0 2px #f0b8d8; }

    .thumb-label {
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(208, 128, 176, 0.95);
      color: #fff;
      font-size: 9px;
      padding: 1px 8px;
      border-radius: 10px;
      white-space: nowrap;
      font-weight: 500;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 6px rgba(180, 100, 140, 0.3);
      pointer-events: none;
    }

    #detail-text {
      flex: 1 1 300px;
      min-width: 200px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #5a3a4a;
    }
    #detail-text h2 {
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 2px;
      color: #5a3a4a;
      border-bottom: 2px solid rgba(240, 190, 215, 0.4);
      padding-bottom: 6px;
      word-break: break-word;
    }
    #detail-text .sub {
      font-size: 13px;
      color: #a07088;
      letter-spacing: 1px;
      margin-top: -2px;
    }
    #detail-text .concept {
      font-size: 15px;
      line-height: 1.8;
      color: #5a3a4a;
      background: rgba(255, 235, 245, 0.6);
      padding: 14px 16px;
      border-radius: 16px;
      border-left: 3px solid #f0b0d0;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      -webkit-overflow-scrolling: touch;
    }
    #detail-text .concept-en {
      font-size: 14px;
      line-height: 1.7;
      color: #7a5a6a;
      background: rgba(250, 240, 248, 0.5);
      padding: 12px 16px;
      border-radius: 16px;
      border-left: 3px solid #e0a0c5;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      -webkit-overflow-scrolling: touch;
      font-style: italic;
    }
    #detail-text .concept::-webkit-scrollbar, #detail-text .concept-en::-webkit-scrollbar { width: 4px; }
    #detail-text .concept::-webkit-scrollbar-track, #detail-text .concept-en::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 8px; }
    #detail-text .concept::-webkit-scrollbar-thumb, #detail-text .concept-en::-webkit-scrollbar-thumb { background: #e0a0c5; border-radius: 8px; }

    .detail-footer {
      font-size: 12px;
      color: #b090a0;
      text-align: right;
      border-top: 1px solid rgba(240, 190, 215, 0.3);
      padding-top: 10px;
      margin-top: 2px;
    }
    .lang-tag {
      font-size: 11px;
      color: #b08098;
      background: rgba(240, 190, 215, 0.2);
      padding: 2px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-right: 6px;
      font-weight: 400;
    }

    @media (max-width: 700px) {
      #detail-box { padding: 16px 14px; max-height: 96vh; border-radius: 24px; }
      #detail-content { flex-direction: column; gap: 14px; }
      #detail-image-area { flex: 1 1 auto; min-width: 0; }
      #detail-main-img { max-height: 300px; min-height: 160px; border-radius: 14px; }
      #detail-text h2 { font-size: 20px; }
      #detail-text .concept { font-size: 14px; max-height: 180px; padding: 12px 14px; }
      #detail-text .concept-en { font-size: 13px; max-height: 160px; padding: 10px 14px; }
      .thumb-img { width: 52px; height: 52px; }
      .thumb-label { font-size: 8px; padding: 1px 6px; }
      #detail-close { width: 38px; height: 38px; font-size: 22px; }
      #mode-badge { font-size: 10px; padding: 4px 10px; }
    }
    @media (max-width: 400px) {
      #detail-box { padding: 12px 10px; }
      #detail-main-img { max-height: 220px; min-height: 120px; }
      #detail-text h2 { font-size: 18px; }
      #detail-text .concept { font-size: 13px; max-height: 150px; }
      #detail-text .concept-en { font-size: 12px; max-height: 140px; }
      .thumb-img { width: 44px; height: 44px; }
      .thumb-label { font-size: 7px; padding: 1px 5px; }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .click-hint {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      color: #9a5a80;
      background: rgba(255, 240, 248, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 13px;
      letter-spacing: 2px;
      border: 1px solid rgba(240, 180, 210, 0.3);
      pointer-events: none;
      z-index: 10;
      opacity: 0.9;
      white-space: nowrap;
    }
    @media (max-width: 600px) { 
      .click-hint { bottom: 70px; font-size: 11px; padding: 4px 14px; letter-spacing: 1px; }
    }
    @media (max-width: 400px) { 
      .click-hint { bottom: 62px; font-size: 10px; padding: 3px 12px; }
    }
  </style>
</head>
<body>
  <div id="loading">✦ 載入淡粉色星空MR空間 ✦</div>
  <div id="mr-banner">✨ MR 混合實境 · 淡粉色星空藝術體驗 ✨</div>
  
  <div id="mr-scanner"></div>
  <div id="mr-ambient"></div>
  <div class="mr-corner tl"></div>
  <div class="mr-corner tr"></div>
  <div class="mr-corner bl"></div>
  <div class="mr-corner br"></div>
  
  <div id="info">🖱️ 拖拽旋轉 · 滾輪縮放 · 點擊畫作臥遊 🏞️ <span>「 鄭雨絲 · 淡粉色星空MR 」</span></div>
  <div class="click-hint">👆 點擊畫作 · 臥遊細節</div>

  <div id="detail-overlay">
    <div id="detail-box">
      <button id="detail-close" aria-label="關閉">✕</button>
      <div id="detail-content">
        <div id="detail-image-area">
          <img id="detail-main-img" src="" alt="作品主圖">
          <canvas id="immersive-video-canvas"></canvas>
          <div id="mr-anim-overlay"></div>
          <div id="anim-progress"><div id="anim-progress-bar"></div></div>
          <div id="mode-badge"></div>
          <div class="mr-glow-effect"></div>
          <div id="detail-thumbs"></div>
        </div>
        <div id="detail-text">
          <h2 id="detail-title">作品名</h2>
          <div class="sub" id="detail-sub">尺寸 · 年份</div>
          <div class="concept" id="detail-concept"><span class="lang-tag">中文</span>創作理念載入中...</div>
          <div class="concept-en" id="detail-concept-en"><span class="lang-tag">English</span>Loading...</div>
          <div class="detail-footer">👆 點擊縮略圖切換模式 · 主圖可縮放</div>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // --- DOM refs ---
    const detailOverlay = document.getElementById('detail-overlay');
    const detailClose = document.getElementById('detail-close');
    const detailMainImg = document.getElementById('detail-main-img');
    const detailTitle = document.getElementById('detail-title');
    const detailSub = document.getElementById('detail-sub');
    const detailConcept = document.getElementById('detail-concept');
    const detailConceptEn = document.getElementById('detail-concept-en');
    const detailThumbs = document.getElementById('detail-thumbs');
    const immersiveCanvas = document.getElementById('immersive-video-canvas');
    const immersiveCtx = immersiveCanvas.getContext('2d');
    const mrAnimOverlay = document.getElementById('mr-anim-overlay');
    const animProgress = document.getElementById('anim-progress');
    const animProgressBar = document.getElementById('anim-progress-bar');
    const modeBadge = document.getElementById('mode-badge');
    const mrGlowEffect = document.querySelector('.mr-glow-effect');

    // 1:1 高清畫布
    immersiveCanvas.width = 800;
    immersiveCanvas.height = 800;

    // 動畫狀態
    let videoAnimFrameId = null;
    let videoAnimStartTime = 0;
    let videoAnimRunning = false;
    let currentMode = 'original';
    const VIDEO_DURATION = 10000;

    // --- 1. 場景 ---
    const scene = new THREE.Scene();
    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 1024;
    const ctx = canvas.getContext('2d');
    
    const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    gradient.addColorStop(0, '#fce8f0');
    gradient.addColorStop(0.2, '#fad8e8');
    gradient.addColorStop(0.4, '#f5c8e0');
    gradient.addColorStop(0.6, '#f0b8d8');
    gradient.addColorStop(0.8, '#e8b0d5');
    gradient.addColorStop(1, '#e0a8d0');
    
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    const nebulaColors = [
      'rgba(255, 210, 235, 0.2)',
      'rgba(250, 195, 225, 0.18)',
      'rgba(240, 200, 240, 0.15)',
      'rgba(255, 220, 240, 0.2)',
      'rgba(245, 200, 230, 0.18)',
      'rgba(235, 195, 235, 0.15)'
    ];
    
    for (let i = 0; i < 40; i++) {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height;
      const radius = 120 + Math.random() * 350;
      const nebulaGrad = ctx.createRadialGradient(x, y, 0, x, y, radius);

    // 缓动函数
    const smoothstep = (x) => {

    // 绘制水墨青绿山水层（圆形内）
    function drawInkLayer(c, cx, cy, R, t) {
      const x0 = cx - R, y0 = cy - R;
      
      // 天空——青绿渐变
      const skyGrad = c.createLinearGradient(x0, y0, x0, y0 + R * 1.2);
      skyGrad.addColorStop(0, '#dce8e0');
      skyGrad.addColorStop(0.4, '#e8e8d8');
      skyGrad.addColorStop(0.7, '#f0dcc0');
      skyGrad.addColorStop(1, '#e8d0b0');
      c.fillStyle = skyGrad;
      c.fillRect(x0, y0, R * 2, R * 2);
      
      // 远山（多层）
      drawInkMountainLayer(c, x0, y0, R, 0.35, '#8ab8a8', '#5a9a8a', t, 0.6);
      drawInkMountainLayer(c, x0, y0, R, 0.45, '#6aaa9a', '#4a8a7a', t, 1.2);
      drawInkMountainLayer(c, x0, y0, R, 0.55, '#4a8a7a', '#2a6a5a', t, 1.8);
      
      // 水面（青绿色）
      const waterY = y0 + R * 1.35;
      const waterGrad = c.createLinearGradient(x0, waterY, x0, y0 + R * 2);
      waterGrad.addColorStop(0, '#a8c8c0');
      waterGrad.addColorStop(1, '#5a8a80');
      c.fillStyle = waterGrad;
      c.fillRect(x0, waterY, R * 2, R * 2 - (waterY - y0));
      
      // 水波涟漪
      c.strokeStyle = 'rgba(255,255,255,0.35)';
      c.lineWidth = 1.2;
      for (let i = 0; i < 6; i++) {
        c.beginPath();
        for (let x = x0; x < x0 + R * 2; x += 5) {
          const y = waterY + 15 + i * 12 + Math.sin(x * 0.05 + t * 2.5 + i * 0.8) * 2.5;
          if (x === x0) c.moveTo(x, y);
          else c.lineTo(x, y);
        }
        c.stroke();
      }
      
      // 前景绘制青瓷碗（在画面下方中央）
      drawInkBowl(c, cx, cy + R * 0.55, R * 0.55, t);
    }
    
    // 画水墨山峦层
    function drawInkMountainLayer(c, x0, y0, R, baseRatio, colorTop, colorBottom, t, phase) {
      const baseY = y0 + R * baseRatio * 2;
      c.beginPath();
      c.moveTo(x0, y0 + R * 2);
      c.lineTo(x0, baseY);
      
      for (let x = 0; x <= R * 2; x += 4) {
        const n1 = Math.sin((x + t * 15 + phase * 50) * 0.008) * R * 0.18;
        const n2 = Math.sin((x + t * 15 + phase * 50) * 0.02 + 1.5) * R * 0.1;
        const n3 = Math.sin((x + t * 15 + phase * 50) * 0.04 + 3) * R * 0.05;
        c.lineTo(x0 + x, baseY + n1 + n2 + n3);
      }
      
      c.lineTo(x0 + R * 2, y0 + R * 2);
      c.closePath();
      
      const grad = c.createLinearGradient(x0, baseY - R * 0.3, x0, baseY + R * 0.8);
      grad.addColorStop(0, colorTop);
      grad.addColorStop(1, colorBottom);
      c.fillStyle = grad;
      c.fill();
    }
    
    // 画青瓷碗（水墨风格）
    function drawInkBowl(c, cx, cy, size, t) {
      // 碗身（青瓷半圆）
      const bowlGrad = c.createLinearGradient(cx - size, cy - size * 0.5, cx + size, cy + size * 0.8);
      bowlGrad.addColorStop(0, '#c8d8d0');
      bowlGrad.addColorStop(0.5, '#90a8a0');
      bowlGrad.addColorStop(1, '#608078');
      
      c.beginPath();
      c.ellipse(cx, cy, size, size * 0.65, 0, 0, Math.PI);
      c.closePath();
      c.fillStyle = bowlGrad;
      c.fill();
      
      // 碗口（椭圆）
      c.beginPath();
      c.ellipse(cx, cy, size, size * 0.18, 0, 0, Math.PI * 2);
      c.fillStyle = '#e0e8e4';
      c.fill();
      c.strokeStyle = '#8aa098';
      c.lineWidth = 2;
      c.stroke();
      
      // 碗中水面（碗内的涟漪）
      c.beginPath();
      c.ellipse(cx, cy, size * 0.92, size * 0.16, 0, 0, Math.PI * 2);
      c.fillStyle = 'rgba(180, 220, 220, 0.85)';
      c.fill();
      
      // 碗内的迷你山峦（水墨色）
      for (let i = 0; i < 3; i++) {
        const mx = cx + (i - 1) * size * 0.4;
        const mh = size * (0.25 + i * 0.08);
        c.beginPath();
        c.moveTo(mx - size * 0.25, cy);
        c.lineTo(mx, cy - mh);
        c.lineTo(mx + size * 0.25, cy);
        c.closePath();
        const mGrad = c.createLinearGradient(mx, cy - mh, mx, cy);
        mGrad.addColorStop(0, i === 1 ? '#5a8a7a' : '#7aa898');
        mGrad.addColorStop(1, i === 1 ? '#2a5a4a' : '#4a7a6a');
        c.fillStyle = mGrad;
        c.fill();
      }
      
      // 碗中水面涟漪
      c.strokeStyle = 'rgba(255,255,255,0.5)';
      c.lineWidth = 1;
      for (let i = 0; i < 3; i++) {
        c.beginPath();
        c.ellipse(cx, cy - i * 2, size * (0.3 + i * 0.2), size * (0.05 + i * 0.03), 0, 0, Math.PI * 2);
        c.stroke();
      }
    }
    
    // 绘制真实山水层
    function drawRealLayer(c, cx, cy, R, t, zoom) {
      const x0 = cx - R, y0 = cy - R;
      
      // 真实天空——蓝白渐变
      const skyGrad = c.createLinearGradient(x0, y0, x0, y0 + R * 1.2);
      skyGrad.addColorStop(0, '#87b8dc');
      skyGrad.addColorStop(0.3, '#b8d4e8');
      skyGrad.addColorStop(0.6, '#e0e8e8');
      skyGrad.addColorStop(1, '#f0e8d0');
      c.fillStyle = skyGrad;
      c.fillRect(x0, y0, R * 2, R * 2);
      
      // 真实群山（航拍视角，多层云雾缭绕）
      drawRealMountainLayer(c, x0, y0, R, 0.35, '#7a9a88', '#4a6a58', t, 0.4, 0.7);
      drawRealMountainLayer(c, x0, y0, R, 0.45, '#6a8a78', '#3a5a48', t, 0.8, 0.9);
      drawRealMountainLayer(c, x0, y0, R, 0.55, '#5a7a68', '#2a4a38', t, 1.2, 1);
      
      // 云海流动效果
      for (let i = 0; i < 10; i++) {
        const cloudX = ((t * 25 + i * 130) % (R * 3)) - R * 0.5;
        const cloudY = y0 + R * (0.55 + i * 0.06) + Math.sin(t * 0.8 + i) * R * 0.02;
        const cloudW = R * (0.25 + (i % 3) * 0.1);
        const cloudH = R * (0.06 + (i % 2) * 0.03);
        
        const cloudGrad = c.createRadialGradient(cloudX, cloudY, 0, cloudX, cloudY, cloudW);
        cloudGrad.addColorStop(0, `rgba(255, 255, 255, ${0.55 - i * 0.03})`);
        cloudGrad.addColorStop(0.5, `rgba(255, 255, 255, ${0.25 - i * 0.015})`);
        cloudGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        c.fillStyle = cloudGrad;
        c.beginPath();
        c.ellipse(cloudX, cloudY, cloudW, cloudH, 0, 0, Math.PI * 2);
        c.fill();
      }
      
      // 真实水面（底部）
      const waterY = y0 + R * 1.4;
      const waterGrad = c.createLinearGradient(x0, waterY, x0, y0 + R * 2);
      waterGrad.addColorStop(0, 'rgba(120, 160, 170, 0.85)');
      waterGrad.addColorStop(1, 'rgba(60, 100, 110, 0.95)');
      c.fillStyle = waterGrad;
      c.fillRect(x0, waterY, R * 2, R * 2 - (waterY - y0));
      
      // 真实水面涟漪（更细腻）
      for (let i = 0; i < 8; i++) {
        c.strokeStyle = `rgba(220, 240, 250, ${0.4 - i * 0.04})`;
        c.lineWidth = 1;
        c.beginPath();
        for (let x = x0; x < x0 + R * 2; x += 5) {
          const y = waterY + 10 + i * 8 + Math.sin(x * 0.06 + t * 3 + i) * 2;
          if (x === x0) c.moveTo(x, y);
          else c.lineTo(x, y);
        }
        c.stroke();
      }
      
      // 水面上的高光反射
      for (let i = 0; i < 30; i++) {
        const sparkle = Math.abs(Math.sin(t * 3 + i * 0.7));
        if (sparkle > 0.5) {
          const sx = x0 + (i * 137 % (R * 2));
          const sy = waterY + 8 + (i * 43 % (R * 0.6));
          c.fillStyle = `rgba(255, 255, 255, ${(sparkle - 0.5) * 1.6})`;
          c.beginPath();
          c.arc(sx, sy, 1.2, 0, Math.PI * 2);
          c.fill();
        }
      }
    }
    
    // 真实山峦层
    function drawRealMountainLayer(c, x0, y0, R, baseRatio, colorTop, colorBottom, t, phase, alpha) {
      const baseY = y0 + R * baseRatio * 2;
      c.globalAlpha = alpha;
      
      c.beginPath();
      c.moveTo(x0, y0 + R * 2);
      c.lineTo(x0, baseY);
      
      for (let x = 0; x <= R * 2; x += 3) {
        const n1 = Math.sin((x + t * 8 + phase * 60) * 0.006) * R * 0.22;
        const n2 = Math.sin((x + t * 8 + phase * 60) * 0.015 + 1.5) * R * 0.12;
        const n3 = Math.sin((x + t * 8 + phase * 60) * 0.035 + 3) * R * 0.05;
        const n4 = Math.sin((x + t * 8 + phase * 60) * 0.08 + 5) * R * 0.02;
        c.lineTo(x0 + x, baseY + n1 + n2 + n3 + n4);
      }
      
      c.lineTo(x0 + R * 2, y0 + R * 2);
      c.closePath();
      
      const grad = c.createLinearGradient(x0, baseY - R * 0.3, x0, baseY + R * 0.8);
      grad.addColorStop(0, colorTop);
      grad.addColorStop(1, colorBottom);
      c.fillStyle = grad;
      c.fill();
      
      c.globalAlpha = 1;
    }
    
    // 圆形画框（外部装饰）
    function drawCircularFrame(c, cx, cy, R, alpha) {
      c.globalAlpha = alpha;
      
      // 外圈深绿（国风青绿框）
      c.strokeStyle = '#2a4a3a';
      c.lineWidth = R * 0.045;
      c.beginPath();
      c.arc(cx, cy, R, 0, Math.PI * 2);
      c.stroke();
      
      // 内金色装饰线
      c.strokeStyle = '#c8a870';
      c.lineWidth = R * 0.012;
      c.beginPath();
      c.arc(cx, cy, R * 1.012, 0, Math.PI * 2);
      c.stroke();
      c.beginPath();
      c.arc(cx, cy, R * 0.988, 0, Math.PI * 2);
      c.stroke();
      
      // 金色小圆点（装饰）
      c.fillStyle = '#c8a870';
      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2;
        const px = cx + Math.cos(a) * R * 1.012;
        const py = cy + Math.sin(a) * R * 1.012;
        c.beginPath();
        c.arc(px, py, R * 0.008, 0, Math.PI * 2);
        c.fill();
      }
      
      c.globalAlpha = 1;
    }
    
    // 主动画绘制函数
    function drawImmersiveVideo(elapsedMs) {
      const W = immersiveCanvas.width;
      const H = immersiveCanvas.height;
      const c = immersiveCtx;
      const cx = W / 2;
      const cy = H / 2;
      const t = elapsedMs / 1000;
      const totalT = VIDEO_DURATION / 1000;
      
      // 时间轴阶段
      // 0-2s: 全景展示（圆形国风青绿山水画 + 碗）
      // 2-7s: 镜头推入（水墨→真实过渡 + 云海流动）
      // 7-10s: 镜头拉回（恢复圆形装饰画）
      let zoom, inkAlpha, realAlpha, frameAlpha;
      
      if (t < 2) {
        // 阶段一：全景
        const p = t / 2;
        zoom = 1;
        inkAlpha = 1;
        realAlpha = 0;
        frameAlpha = 1;
      } else if (t < 7) {
        // 阶段二：推入
        const p = (t - 2) / 5;
        const ep = smoothstep(p);
        zoom = 1 + ep * 9;
        inkAlpha = 1 - smoothstep(Math.min(1, p * 1.4));
        realAlpha = smoothstep(Math.max(0, (p - 0.25) / 0.7));
        frameAlpha = 1 - smoothstep(Math.min(1, p * 1.8));
      } else {
        // 阶段三：拉回
        const p = (t - 7) / 3;
        const ep = smoothstep(p);
        zoom = 10 - ep * 9;
        inkAlpha = smoothstep(Math.min(1, p * 1.4));
        realAlpha = Math.max(0, 1 - smoothstep(Math.min(1, p * 1.5)));
        frameAlpha = smoothstep(Math.min(1, p * 1.8));
      }
      
      // 背景（柔和的米黄色调）
      const bgGrad = c.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.8);
      bgGrad.addColorStop(0, '#f8f4ec');
      bgGrad.addColorStop(1, '#e0d4c0');
      c.fillStyle = bgGrad;
      c.fillRect(0, 0, W, H);
      
      // 圆形画框半径
      const circleR = Math.min(W, H) * 0.42;
      
      // 裁剪到圆形
      c.save();
      c.beginPath();
      c.arc(cx, cy, circleR, 0, Math.PI * 2);
      c.clip();
      
      // 内容缩放变换（镜头推入/拉远效果）
      c.translate(cx, cy);
      c.scale(zoom, zoom);
      c.translate(-cx, -cy);
      
      // 兜底填充
      c.fillStyle = '#dce8e0';
      c.fillRect(cx - circleR * 3, cy - circleR * 3, circleR * 6, circleR * 6);
      
      // 绘制水墨层
      if (inkAlpha > 0.01) {
        c.globalAlpha = inkAlpha;
        drawInkLayer(c, cx, cy, circleR, t);
        c.globalAlpha = 1;
      }
      
      // 绘制真实层（叠加过渡）
      if (realAlpha > 0.01) {
        c.globalAlpha = realAlpha;
        drawRealLayer(c, cx, cy, circleR, t, zoom);
        c.globalAlpha = 1;
      }
      
      c.restore();
      
      // 绘制圆形画框
      if (frameAlpha > 0.01) {
        drawCircularFrame(c, cx, cy, circleR, frameAlpha);
      }
    }

    function startImmersiveVideo() {
      if (videoAnimRunning) return;
      videoAnimRunning = true;
      videoAnimStartTime = performance.now();
      immersiveCanvas.classList.add('active');
      mrAnimOverlay.classList.add('active');
      animProgress.classList.add('active');
      detailMainImg.style.opacity = '0';
      detailMainImg.style.position = 'absolute';

      function loop(now) {
        if (!videoAnimRunning) return;
        const elapsed = now - videoAnimStartTime;
        const progress = Math.min(1, elapsed / VIDEO_DURATION);

        drawImmersiveVideo(elapsed);
        animProgressBar.style.width = (progress * 100) + '%';
        
        if (progress < 1) {
          videoAnimFrameId = requestAnimationFrame(loop);
        } else {
          // 10秒后自动回到原图
          setTimeout(() => {
            if (currentMode === 'animated') {
              setViewMode('original');
            }
          }, 400);
        }
      }
      videoAnimFrameId = requestAnimationFrame(loop);
    }

    function stopImmersiveVideo() {
      videoAnimRunning = false;
      if (videoAnimFrameId) {
        cancelAnimationFrame(videoAnimFrameId);
        videoAnimFrameId = null;
      }
      immersiveCanvas.classList.remove('active');
      mrAnimOverlay.classList.remove('active');
      animProgress.classList.remove('active');
      animProgressBar.style.width = '0%';
      detailMainImg.style.opacity = '1';
      detailMainImg.style.position = 'relative';
    }

    // 創建玫瑰淡粉金色木紋紋理
    function createRoseGoldWoodTexture() {
      const w = 256, h = 256;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const cx = c.getContext('2d');
      
      cx.fillStyle = '#e8c0c8';
      cx.fillRect(0, 0, w, h);
      
      cx.globalAlpha = 0.2;
      for (let i = 0; i < 30; i++) {
        cx.strokeStyle = '#c89098';
        cx.lineWidth = Math.random() * 1.5 + 0.5;
        cx.beginPath();
        const y = Math.random() * h;
        cx.moveTo(0, y);
        for (let x = 0; x < w; x += 15) {
          cx.lineTo(x, y + Math.sin(x * 0.04 + i) * 5);
        }
        cx.stroke();
      }
      
      cx.globalAlpha = 0.15;
      for (let i = 0; i < 20; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const r = 10 + Math.random() * 25;
        const grad = cx.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, '#fff0f4');
        grad.addColorStop(1, 'transparent');
        cx.fillStyle = grad;
        cx.beginPath();
        cx.arc(x, y, r, 0, Math.PI * 2);
        cx.fill();
      }
      
      cx.globalAlpha = 1;
      return new THREE.CanvasTexture(c);
    }

      const x = Math.sin(angle) * radius;
      const z = Math.cos(angle) * radius - 1.5;
      const y = 0.2 + Math.sin(angle * 1.5) * 0.3;

      const frameWidth = 1.9;
      const frameHeight = 2.1;
      const frameThickness = 0.1;
      const frameDepth = 0.1;
      const backplateThickness = 0.02;

      const backplateMat = new THREE.MeshLambertMaterial({
        color: 0xfad8e4,
        emissive: 0x000000,
        side: THREE.DoubleSide
      });
      const backplateGeo = new THREE.BoxGeometry(
        frameWidth + frameThickness * 2, 
        frameHeight + frameThickness * 2, 
        backplateThickness
      );
      const backplate = new THREE.Mesh(backplateGeo, backplateMat);
      backplate.castShadow = true;
      backplate.receiveShadow = true;
      backplate.position.set(x, y, z - frameDepth / 2 + backplateThickness / 2);
      scene.add(backplate);

      const frameMat = new THREE.MeshStandardMaterial({
        map: roseGoldTexture,
        color: 0xf0c8d0,
        emissive: 0xd8a0b0,
        emissiveIntensity: 0.2,
        roughness: 0.35,
        metalness: 0.55,
        side: THREE.DoubleSide
      });

      const topFrame = new THREE.Mesh(
        new THREE.BoxGeometry(frameWidth + frameThickness * 2, frameThickness, frameDepth),
        frameMat
      );
      topFrame.castShadow = true;
      topFrame.receiveShadow = true;
      topFrame.position.set(x, y + frameHeight / 2 + frameThickness / 2, z);
      scene.add(topFrame);

      const bottomFrame = new THREE.Mesh(
        new THREE.BoxGeometry(frameWidth + frameThickness * 2, frameThickness, frameDepth),
        frameMat
      );
      bottomFrame.castShadow = true;
      bottomFrame.receiveShadow = true;
      bottomFrame.position.set(x, y - frameHeight / 2 - frameThickness / 2, z);
      scene.add(bottomFrame);

      const leftFrame = new THREE.Mesh(
        new THREE.BoxGeometry(frameThickness, frameHeight, frameDepth),
        frameMat
      );
      leftFrame.castShadow = true;
      leftFrame.receiveShadow = true;
      leftFrame.position.set(x - frameWidth / 2 - frameThickness / 2, y, z);
      scene.add(leftFrame);

      const rightFrame = new THREE.Mesh(
        new THREE.BoxGeometry(frameThickness, frameHeight, frameDepth),
        frameMat
      );
      rightFrame.castShadow = true;
      rightFrame.receiveShadow = true;
      rightFrame.position.set(x + frameWidth / 2 + frameThickness / 2, y, z);
      scene.add(rightFrame);

      const innerGoldMat = new THREE.MeshStandardMaterial({
        color: 0xe0b0b8,
        emissive: 0xc89098,
        emissiveIntensity: 0.3,
        roughness: 0.25,
        metalness: 0.75
      });
      const innerThickness = 0.025;
      const innerDepth = 0.025;
      
      const innerTop = new THREE.Mesh(
        new THREE.BoxGeometry(frameWidth + innerThickness * 2, innerThickness, innerDepth),
        innerGoldMat
      );
      innerTop.position.set(x, y + frameHeight / 2 - 0.005, z + frameDepth / 2 - 0.005);
      scene.add(innerTop);
      
      const innerBottom = new THREE.Mesh(
        new THREE.BoxGeometry(frameWidth + innerThickness * 2, innerThickness, innerDepth),
        innerGoldMat
      );
      innerBottom.position.set(x, y - frameHeight / 2 + 0.005, z + frameDepth / 2 - 0.005);
      scene.add(innerBottom);
      
      const innerLeft = new THREE.Mesh(
        new THREE.BoxGeometry(innerThickness, frameHeight, innerDepth),
        innerGoldMat
      );
      innerLeft.position.set(x - frameWidth / 2 + 0.005, y, z + frameDepth / 2 - 0.005);
      scene.add(innerLeft);
      
      const innerRight = new THREE.Mesh(
        new THREE.BoxGeometry(innerThickness, frameHeight, innerDepth),
        innerGoldMat
      );
      innerRight.position.set(x + frameWidth / 2 - 0.005, y, z + frameDepth / 2 - 0.005);
      scene.add(innerRight);

      const textureLoader = new THREE.TextureLoader();
      const placeholderMat = new THREE.MeshBasicMaterial({ color: 0x2a1825 });
      const imgMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(frameWidth, frameHeight),
        placeholderMat
      );
      imgMesh.position.set(x, y, z + frameDepth / 2 - 0.01);
      imgMesh.castShadow = false;
      imgMesh.receiveShadow = false;

      textureLoader.load(item.img, (texture) => {
        texture.minFilter = THREE.LinearMipmapLinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        imgMesh.material = new THREE.MeshBasicMaterial({
          map: texture,
          side: THREE.DoubleSide,
          toneMapped: false,
          transparent: false,
          opacity: 1.0
        });
        imgMesh.material.needsUpdate = true;
      }, undefined, () => {
        imgMesh.material.color.setHex(0x2a1825);
      });
      scene.add(imgMesh);

      const labelDiv = document.createElement('div');
      labelDiv.style.color = '#8a5a75';
      labelDiv.style.fontFamily = '"Segoe UI", "華文細黑", "PingFang TC", sans-serif';
      labelDiv.style.textAlign = 'center';
      labelDiv.style.textShadow = '0 2px 8px rgba(255,220,240,0.6)';
      labelDiv.style.background = 'rgba(255, 245, 250, 0.75)';
      labelDiv.style.backdropFilter = 'blur(6px)';
      labelDiv.style.padding = '5px 14px 7px 14px';
      labelDiv.style.borderRadius = '40px';
      labelDiv.style.border = '1px solid rgba(245, 190, 220, 0.5)';
      labelDiv.style.pointerEvents = 'none';
      labelDiv.style.maxWidth = '200px';
      labelDiv.style.boxShadow = '0 4px 12px rgba(200, 140, 180, 0.15)';
      
      const titleSpan = document.createElement('div');
      titleSpan.style.fontSize = '17px';
      titleSpan.style.fontWeight = '500';
      titleSpan.style.letterSpacing = '1px';
      titleSpan.style.color = '#8a5a75';
      titleSpan.textContent = item.title;
      
      const descSpan = document.createElement('div');
      descSpan.style.fontSize = '11px';
      descSpan.style.fontWeight = '300';
      descSpan.style.color = '#b08098';
      descSpan.style.marginTop = '2px';
      descSpan.textContent = item.desc;
      
      labelDiv.appendChild(titleSpan);
      labelDiv.appendChild(descSpan);
      
      const label = new CSS2DObject(labelDiv);
      label.position.set(x, y - frameHeight/2 - 0.35, z);
      scene.add(label);

      const cardKey = imgMesh.uuid;
      const thumbUrls = generateThumbUrls(item.img);
      cardDataMap.set(cardKey, {
        imgUrl: item.img,
        title: item.title,
        desc: item.desc,
        concept: item.concept,
        conceptEn: item.conceptEn,
        thumbs: thumbUrls,
        hasThreeModes: item.hasThreeModes || false
      });

      cardMeshes.push({ 
        imgMesh, backplate, 
        topFrame, bottomFrame, leftFrame, rightFrame,
        innerTop, innerBottom, innerLeft, innerRight,
        baseY: y, phase: index * 0.5, key: cardKey 
      });
    });

    // 中心装饰
    const centerLabelDiv = document.createElement('div');
    centerLabelDiv.style.color = '#8a5a75';
    centerLabelDiv.style.fontSize = '28px';
    centerLabelDiv.style.fontWeight = '200';
    centerLabelDiv.style.letterSpacing = '10px';
    centerLabelDiv.style.textShadow = '0 0 60px rgba(255, 200, 230, 0.7), 0 0 100px rgba(240, 180, 220, 0.4)';
    centerLabelDiv.style.background = 'rgba(255, 245, 250, 0.5)';
    centerLabelDiv.style.backdropFilter = 'blur(4px)';
    centerLabelDiv.style.padding = '8px 28px';
    centerLabelDiv.style.borderRadius = '60px';
    centerLabelDiv.style.border = '1px solid rgba(245, 190, 220, 0.4)';
    centerLabelDiv.textContent = '✦ 鄭雨絲 ✦';
    const centerLabel = new CSS2DObject(centerLabelDiv);
    centerLabel.position.set(0, 1.9, -2.2);
    scene.add(centerLabel);

    const pillarLightGeo = new THREE.CylinderGeometry(0.02, 0.02, 1.5, 8);
    const pillarLightMat = new THREE.MeshBasicMaterial({
      color: 0xf8c8e0,
      transparent: true,
      opacity: 0.2,
      blending: THREE.AdditiveBlending
    });
    const pillarLight = new THREE.Mesh(pillarLightGeo, pillarLightMat);
    pillarLight.position.set(0, 1.2, -2.2);
    scene.add(pillarLight);

    const mrSphereGeo = new THREE.SphereGeometry(0.3, 16, 16);
    const mrSphereMat = new THREE.MeshBasicMaterial({
      color: 0xffd0e8,
      transparent: true,
      opacity: 0.1,
      wireframe: true,
      blending: THREE.AdditiveBlending
    });
    const mrSphere = new THREE.Mesh(mrSphereGeo, mrSphereMat);
    mrSphere.position.set(0, 1.2, -2.2);
    scene.add(mrSphere);

    const pillarMat = new THREE.MeshStandardMaterial({ 
      color: 0xe8d8c8, 
      emissive: 0xd8c0a8, 
      roughness: 0.7, 
      metalness: 0.05 
    });
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const r = 6.0;
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.12, 0.3, 6), pillarMat);
      pillar.position.set(Math.sin(angle) * r, -0.5, Math.cos(angle) * r - 0.8);
      pillar.castShadow = true;
      pillar.receiveShadow = true;
      scene.add(pillar);
    }
    const glowLight = new THREE.PointLight(0xf0b8d8, 0.3);
    glowLight.position.set(0, 1, -1);
    scene.add(glowLight);

    // --- 8. 點擊交互 ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let currentMainUrl = '';

    function openDetail(cardKey) {
      const data = cardDataMap.get(cardKey);
      if (!data) return;
      
      currentMainUrl = data.imgUrl;
      detailMainImg.src = currentMainUrl;
      detailTitle.textContent = data.title;
      detailSub.textContent = data.desc;
      detailConcept.innerHTML = `<span class="lang-tag">中文</span>${data.concept || '暫無創作理念'}`;
      detailConceptEn.innerHTML = `<span class="lang-tag">English</span>${data.conceptEn || 'No concept available'}`;

      stopImmersiveVideo();
      currentMode = 'original';
      detailMainImg.style.filter = 'none';
      detailMainImg.style.opacity = '1';
      detailMainImg.style.position = 'relative';
      mrGlowEffect.classList.remove('active');

      detailThumbs.innerHTML = '';
      const thumbs = data.thumbs || [data.imgUrl];
      
      const modeLabels = ['🖼️ 原圖', '🎬 沉浸MR', '✨ 高清'];
      const modeKeys = ['original', 'animated', 'hd'];
      
      thumbs.forEach((thumbUrl, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'thumb-wrapper';
        
        const thumb = document.createElement('img');
        thumb.className = 'thumb-img';
        thumb.src = thumbUrl;
        thumb.alt = `模式${idx+1}`;
        thumb.dataset.url = thumbUrl;
        thumb.dataset.mode = modeKeys[idx] || 'original';
        
        if (data.hasThreeModes) {
          if (idx === 0) thumb.classList.add('active');
          const label = document.createElement('div');
          label.className = 'thumb-label';
          label.textContent = modeLabels[idx] || '';
          wrapper.appendChild(thumb);
          wrapper.appendChild(label);
        } else {
          if (idx === 0) thumb.classList.add('active');
          wrapper.appendChild(thumb);
        }

        const handleSwitch = (e) => {
          if (e) { e.stopPropagation(); e.preventDefault && e.preventDefault(); }
          
          if (data.hasThreeModes) {
            setViewMode(modeKeys[idx] || 'original');
          } else {
            currentMainUrl = thumbUrl;
            detailMainImg.src = thumbUrl;
            detailThumbs.querySelectorAll('.thumb-img').forEach(el => el.classList.remove('active'));
            thumb.classList.add('active');
          }
        };

        thumb.addEventListener('click', handleSwitch);
        thumb.addEventListener('touchend', handleSwitch);

        detailThumbs.appendChild(wrapper);
      });

      if (data.hasThreeModes) {
        setViewMode('original');
      }

      detailOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeDetail() {
      stopImmersiveVideo();
      currentMode = 'original';
      detailOverlay.classList.remove('active');
      document.body.style.overflow = '';
      detailMainImg.src = '';
      detailThumbs.innerHTML = '';
      detailMainImg.style.filter = 'none';
      detailMainImg.style.opacity = '1';
      detailMainImg.style.position = 'relative';
      mrGlowEffect.classList.remove('active');
    }

    function handlePointer(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      let clientX, clientY;
      if (event.touches) {
        clientX = event.touches[0].clientX;
        clientY = event.touches[0].clientY;
        event.preventDefault();
      } else {
        clientX = event.clientX;
        clientY = event.clientY;
      }
      mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const meshes = cardMeshes.map(item => item.imgMesh);
      const intersects = raycaster.intersectObjects(meshes);

      if (intersects.length > 0) {
        const hitMesh = intersects[0].object;
        for (let card of cardMeshes) {
          if (card.imgMesh === hitMesh) {
            openDetail(card.key);
            break;
          }
        }
      }
    }

    renderer.domElement.addEventListener('click', handlePointer);
    renderer.domElement.addEventListener('touchstart', handlePointer, { passive: false });

    detailClose.addEventListener('click', closeDetail);
    detailClose.addEventListener('touchend', (e) => { e.preventDefault(); closeDetail(); });
    detailOverlay.addEventListener('click', (e) => {
      if (e.target === detailOverlay) closeDetail();
    });
    detailOverlay.addEventListener('touchend', (e) => {
      if (e.target === detailOverlay) { e.preventDefault(); closeDetail(); }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDetail();
    });

    let zoomed = false;
    detailMainImg.addEventListener('click', () => {
      if (videoAnimRunning) return;
      if (zoomed) {
        detailMainImg.style.transform = 'scale(1)';
        detailMainImg.style.cursor = 'zoom-in';
        zoomed = false;
      } else {
        detailMainImg.style.transform = 'scale(1.4)';
        detailMainImg.style.cursor = 'zoom-out';
        zoomed = true;
      }
    });
    detailMainImg.addEventListener('touchend', (e) => {
      if (videoAnimRunning) return;
      e.preventDefault();
      if (zoomed) {
        detailMainImg.style.transform = 'scale(1)';
        detailMainImg.style.cursor = 'zoom-in';
        zoomed = false;
      } else {
        detailMainImg.style.transform = 'scale(1.4)';
        detailMainImg.style.cursor = 'zoom-out';
        zoomed = true;
      }
    });

    // --- 9. 動畫循環 ---
    function animate() {
      const elapsedTime = performance.now() * 0.001;

      cardMeshes.forEach((item, idx) => {
        const offsetY = Math.sin(elapsedTime * 0.4 + idx * 0.6) * 0.025;
        const baseY = 0.2 + Math.sin((idx / cardMeshes.length) * 6.28 * 0.5) * 0.3;
        const newY = baseY + offsetY;
        
        item.imgMesh.position.y = newY;
        item.backplate.position.y = newY;
        item.topFrame.position.y = newY + 1.05 + 0.05;
        item.bottomFrame.position.y = newY - 1.05 - 0.05;
        item.leftFrame.position.y = newY;
        item.rightFrame.position.y = newY;
        item.innerTop.position.y = newY + 1.05 - 0.005;
        item.innerBottom.position.y = newY - 1.05 + 0.005;
        item.innerLeft.position.y = newY;
        item.innerRight.position.y = newY;
      });

      ring.rotation.z += 0.001;
      ring2.rotation.z -= 0.0008;
      ring3.rotation.z += 0.0005;
      mrRing.rotation.z -= 0.0012;
      ring.material.opacity = 0.18 + Math.sin(elapsedTime * 0.8) * 0.08;
      ring2.material.opacity = 0.12 + Math.sin(elapsedTime * 0.6) * 0.05;
      ring3.material.opacity = 0.08 + Math.sin(elapsedTime * 0.5) * 0.04;
      mrRing.material.opacity = 0.15 + Math.sin(elapsedTime * 1.2) * 0.15;

      particles.rotation.y += 0.00015;
      arDots.rotation.y -= 0.00025;

      pillarLight.material.opacity = 0.15 + Math.sin(elapsedTime * 2) * 0.1;

      mrSphere.rotation.y += 0.005;
      mrSphere.rotation.x += 0.003;
      mrSphere.material.opacity = 0.08 + Math.sin(elapsedTime * 1.5) * 0.06;

      mrLight1.position.x = 2 + Math.sin(elapsedTime * 0.5) * 1.5;
      mrLight1.position.z = 3 + Math.cos(elapsedTime * 0.4) * 1.5;
      mrLight2.position.x = -2 + Math.sin(elapsedTime * 0.6 + 1) * 1.5;
      mrLight2.position.z = 2 + Math.cos(elapsedTime * 0.5 + 1) * 1.5;
      mrLight3.position.y = 2 + Math.sin(elapsedTime * 0.7 + 2) * 0.8;

      controls.update();

      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    // --- 10. 自適應 ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    document.addEventListener('touchmove', (e) => {
      if (e.target === renderer.domElement) e.preventDefault();
    }, { passive: false });

    setTimeout(() => {
      document.getElementById('loading')?.classList.add('hide');
    }, 500);

    console.log('🌸 淡粉色星空MR展廳已啟動 | 悠然自得三模式縮略圖 | 沉浸式MR短片');
  </script>
</body>
</html>
